plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = 'blockvault-neoforge'
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
            srcDir '../shared-client/src/main/java'
        }
        resources {
            srcDir '../core/src/main/resources'
            srcDir '../shared-client/src/main/resources'
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
    }
    mods {
        "blockvault" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    from('../LICENSE') {
        rename { "${it}_blockvault" }
    }
}

tasks.register('dumpApi') {
    notCompatibleWithConfigurationCache('diagnostic task that shells out to javap')
    doLast {
        def out = layout.buildDirectory.dir('api-dump').get().asFile
        out.mkdirs()
        def cp = sourceSets.main.compileClasspath.asPath
        def classes = file('../tools/api-classes.txt').readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
        classes.each { c ->
            def proc = ['javap', '-public', '-protected', '-cp', cp, c].execute()
            def text = new StringBuilder()
            proc.consumeProcessOutput(text, text)
            proc.waitFor()
            new File(out, c + '.txt').text = text.toString()
        }
    }
}
