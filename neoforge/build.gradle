plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = 'blockvault-neoforge'
}

repositories {
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
            srcDir '../shared-client/src/main/java'
        }
        resources {
            srcDir '../core/src/main/resources'
            srcDir '../shared-client/src/main/resources'
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
    }
    mods {
        "blockvault" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'source,lines'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    from('../LICENSE') {
        rename { "${it}_blockvault" }
    }
}
