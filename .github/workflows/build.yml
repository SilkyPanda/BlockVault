name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  FALLBACK_GRADLE_VERSION: '9.7.1'

jobs:
  rules:
    name: Static rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check project rules
        run: bash scripts/check-rules.sh

  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pick Gradle
        id: gradle
        run: |
          if [ -f gradlew ]; then echo "version=wrapper" >> "$GITHUB_OUTPUT"; else echo "version=${FALLBACK_GRADLE_VERSION}" >> "$GITHUB_OUTPUT"; fi
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Test
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon cleanTest test --console=plain; else gradle --no-daemon cleanTest test --console=plain; fi
      - name: Confirm tests were discovered
        if: success()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob('build/test-results/test/TEST-*.xml')
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          if totals['tests'] == 0:
              raise SystemExit('Core unit test task succeeded but discovered zero tests.')

          line = (f"Core unit tests: {totals['tests']} discovered; "
                  f"{totals['failures']} failures, {totals['errors']} errors, "
                  f"{totals['skipped']} skipped.")
          print(line)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(line + '\n')
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-reports
          path: core/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

  loader:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    defaults:
      run:
        working-directory: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pick Gradle
        id: gradle
        run: |
          if [ -f gradlew ]; then echo "version=wrapper" >> "$GITHUB_OUTPUT"; else echo "version=${FALLBACK_GRADLE_VERSION}" >> "$GITHUB_OUTPUT"; fi
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Build
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon build; else gradle --no-daemon build; fi
      - name: Upload jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blockvault-${{ matrix.loader }}-${{ github.sha }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
