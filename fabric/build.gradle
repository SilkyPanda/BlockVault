plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = 'blockvault-fabric'
}

repositories {
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'Terraformers Maven'
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'com.terraformersmc' }
    }
}

sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
            srcDir '../shared-client/src/main/java'
        }
        resources {
            srcDir '../core/src/main/resources'
            srcDir '../shared-client/src/main/resources'
        }
    }
}

loom {
    mods {
        "blockvault" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
    def v = project.version
    inputs.property 'version', v
    filesMatching('fabric.mod.json') {
        expand 'version': v
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'source,lines'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('../LICENSE') {
        rename { "${it}_blockvault" }
    }
}
